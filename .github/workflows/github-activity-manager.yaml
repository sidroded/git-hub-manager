
name: Activity Manager

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether to commit (55%)
        id: decision
        run: |
          if [ $((RANDOM % 100)) -lt 55 ]; then
            echo "commit=true" >> "$GITHUB_OUTPUT"
            echo "Commit selected!"
          else
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this run."
          fi

      - name: Checkout repository
        if: steps.decision.outputs.commit == 'true'
        uses: actions/checkout@v6

      - name: Update activity file
        if: steps.decision.outputs.commit == 'true'
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > activity.txt

      - name: Commit and push
        if: steps.decision.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "activity-manager@github.com"
          git add activity.txt
          git commit -m "chore: update activity"
          git push
